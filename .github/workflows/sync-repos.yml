name: Sync org repos

# New public repos under pact-safety appear on the site without anyone
# editing it: this refreshes src/data/org-repos.json and commits only on a
# change, and Cloudflare Pages rebuilds on that push.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-repos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the repo list changed
        run: |
          if git diff --quiet -- src/data/org-repos.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/org-repos.json
          git commit -m "sync: update org repo list"
          git push
